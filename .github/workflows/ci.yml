name: CI Pipeline - Sentinela Data Pipeline

on:
  push:
    branches: [main, develop, feat/*, fix/*]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Lint, Testes e Cobertura (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Auditoria de Código com Ruff
        run: |
          ruff check .

      - name: Verificação de Tipos com Mypy
        run: |
          mypy src/

      - name: Executar Testes Automatizados com Cobertura (>= 90%)
        run: |
          pytest --cov=sentinela_pipeline --cov-report=term-missing --cov-report=xml --cov-fail-under=90
