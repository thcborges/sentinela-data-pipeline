[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinela-pipeline"
version = "1.0.0"
description = "Data pipeline, BigQuery lakehouse and geocoding engine for Sentinela Radar"
readme = "README.md"
authors = [
    { name = "Sentinela Radar Team", email = "dev@sentinela.app" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-pubsub>=2.21.0",
    "functions-framework>=3.8.0",
    "requests>=2.31.0",
    "urllib3>=2.2.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinela_pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501", # line-too-long
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=sentinela_pipeline --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
